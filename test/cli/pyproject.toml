[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencanon-cli"
version = "0.1.0"
description = "Open Canon - Standalone Local AI Video & Media Generation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "pynvml>=11.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
]

[project.scripts]
opencanon = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["cli*", "inference*"]
