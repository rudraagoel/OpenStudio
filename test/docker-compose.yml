version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: opencanon-ollama
    ports:
      - "11434:11434"
    volumes:
      - .ollama:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
